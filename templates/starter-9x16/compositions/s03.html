<!doctype html>
<html lang="en">
<body>
<template>
<style>
  #s03{position:absolute;inset:0}
  #s03-signal{position:absolute;left:410px;top:890px}
  #s03-end{position:absolute;left:90px;right:90px;top:1250px;font-size:76px;font-weight:800;line-height:.95;letter-spacing:-.05em;text-align:center}
</style>
<div id="s03" data-composition-id="s03" data-width="1080" data-height="1920">
  <div class="starter-scene">
    <div id="s03-cam" class="starter-camera">
      <div class="starter-grid" data-layout-ignore></div>
      <div class="starter-beam" data-layout-ignore></div>
      <div class="starter-kicker">03 · Output</div>
      <div class="starter-title">CODE BECOMES<br><span class="starter-accent">VIDEO.</span></div>
      <div id="s03-layer"></div>
      <div id="s03-end">SEEK. CHECK.<br>RENDER.</div>
      <div class="starter-footer" data-layout-ignore>BUILT FOR AI CODING AGENTS</div>
    </div>
  </div>
</div>
<script>
(() => {
  const tl=gsap.timeline({paused:true});
  const S=MAFIA.starter;
  const signal=MAFIA.signal.insert("#s03-layer","s03-signal",{size:260,style:"left:410px;top:850px"});
  S.camera(tl, "#s03-cam", {at:0, dur:4, from:1, to:1.1});
  tl.fromTo("#s03 .starter-title",{opacity:0,y:50,filter:"blur(14px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.7,ease:"expo.out"},.1);
  MAFIA.signal.enter(tl,signal,.65);
  MAFIA.signal.orbit(tl,signal,1.15,2.0,1.2);
  MAFIA.signal.react(tl,signal,2.0,1.2);
  S.punch(tl, "#s03-cam", 2.0, {strength:.05});
  tl.fromTo("#s03-end",{opacity:0,y:40,filter:"blur(12px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.7,ease:"expo.out"},1.85);
  window.__timelines.s03=tl;
})();
</script>
