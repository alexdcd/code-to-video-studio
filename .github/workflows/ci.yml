name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Check JS syntax
        run: |
          find scripts kit -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile scripts/lib/qa-video.py tools/sfx/candidates.py
          bash -n scripts/qa.sh tools/sfx/clean.sh
      - name: Validate distribution model
        run: |
          pnpm run distribution:test
          pnpm run distribution:check
      - name: Prepare studio
        run: pnpm run setup
      - name: Verify public distribution
        run: pnpm run verify
      - name: Test public templates and deterministic runtime
        run: pnpm run kit:test
      - name: Validate demo
        run: pnpm run check demo
