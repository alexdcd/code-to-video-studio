name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check JS syntax
        run: |
          find scripts kit -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile scripts/lib/qa-video.py tools/sfx/candidates.py
          bash -n scripts/qa.sh tools/sfx/clean.sh
      - name: Validate distribution model
        run: |
          npm run distribution:test
          npm run distribution:check
      - name: Prepare studio
        run: npm run setup
      - name: Verify public distribution
        run: npm run verify
      - name: Validate demo
        run: npm run check -- demo
